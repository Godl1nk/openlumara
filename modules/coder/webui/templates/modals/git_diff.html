{# -- AI GENERATED CODE (Qwen3.8 Flash Next) :: 2026-10-13
   diff viewer modal for the git sidebar: unified diff text with colored
   +/- lines. opened via $store.ui.openModal('git_diff'). #}
<template x-if="$store.ui.currentModal === 'git_diff' && $store.gitPanel" x-cloak>
    <div class="modal git-diff-modal" @keydown.escape.window="$store.gitPanel.closeDiff()">
        <div class="header">
            <h2 class="coder-editor-title">
                <span x-text="$store.gitPanel.diff.path"></span>
                <span class="git-ro-tag" x-show="$store.gitPanel.diff.staged">staged</span>
            </h2>
            {# -- AI GENERATED CODE (Qwen3.8 Flash Next) :: 2026-10-13
               open the file in the coder editor with the diff points
               highlighted + F8 prev/next navigation #}
            <div class="coder-editor-header-actions">
                {# -- AI GENERATED CODE (Qwen3.8 Flash Next) :: 2026-10-13
                   split diff view toggle (desktop only via CSS) #}
                <button
                    type="button"
                    class="coder-editor-icon-btn"
                    :disabled="$store.gitPanel.diff.loading"
                    @click="$store.gitPanel.openSplitDiff({ path: $store.gitPanel.diff.path, staged: $store.gitPanel.diff.staged, untracked: $store.gitPanel.diff.untracked })"
                    title="Side-by-side view"
                    aria-label="Split diff"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/>
                    </svg>
                </button>
                {# -- AI GENERATED CODE (Qwen3.8 Flash Next) :: 2026-10-13
                   blame button #}
                <button
                    type="button"
                    class="coder-editor-icon-btn"
                    :disabled="$store.gitPanel.diff.loading"
                    @click="$store.gitPanel.openBlame($store.gitPanel.diff.path)"
                    title="Git blame"
                    aria-label="Git blame"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>
                    </svg>
                </button>
                <button
                    type="button"
                    class="coder-editor-icon-btn"
                    :disabled="$store.gitPanel.diff.loading"
                    @click="$store.gitPanel.editFile()"
                    title="Open in editor with changes highlighted"
                    aria-label="Edit file"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                        <path d="m15 5 4 4" />
                    </svg>
                </button>
                <button class="close" @click="$store.gitPanel.closeDiff()" aria-label="Close diff">&times;</button>
            </div>
        </div>

        <pre class="git-diff-body"><template x-for="(line, i) in $store.gitPanel.diff.lines" :key="i"><div class="git-diff-line" :class="{ add: line.startsWith('+') && !line.startsWith('+++'), del: line.startsWith('-') && !line.startsWith('---'), hunk: line.startsWith('@@'), meta: line.startsWith('+++') || line.startsWith('---') }" x-text="line || ' '"></div></template></pre>
    </div>
</template>
