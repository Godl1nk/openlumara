<template x-if="$store.ui.currentModal === 'ask_user' && $store.askUser && $store.askUser.current" x-cloak>
    <div class="modal ask-user-modal" @keydown.escape.window="$store.askUser.cancelCurrent()">
        <div class="header">
            <div class="ask-user-title-group">
                <span class="ask-user-badge">AI Question</span>
                <span class="ask-user-timer" x-show="$store.askUser.current.remaining_seconds > 0" x-text="$store.askUser.current.remaining_seconds + 's left'"></span>
                <span class="ask-user-default-badge" x-show="$store.askUser.current.default_choice" x-text="'Default: ' + $store.askUser.current.default_choice"></span>
            </div>
            <button class="close" @click="$store.askUser.cancelCurrent()" aria-label="Dismiss">&times;</button>
        </div>

        <div class="ask-user-body">
            <div class="ask-user-question" x-text="$store.askUser.current.question"></div>

            <!-- Choice Options (if provided) -->
            <template x-if="$store.askUser.current.options && $store.askUser.current.options.length > 0">
                <div class="ask-user-options">
                    <template x-for="opt in $store.askUser.current.options" :key="opt">
                        <button
                            type="button"
                            class="ask-user-option-btn"
                            :disabled="$store.askUser.submitting"
                            @click="$store.askUser.selectOption(opt)"
                            x-text="opt"
                        ></button>
                    </template>
                </div>
            </template>

            <!-- Custom text input form -->
            <form class="ask-user-form" @submit.prevent="$store.askUser.submitText()">
                <label class="ask-user-input-label" for="ask-user-custom-input">
                    <span x-show="$store.askUser.current.options && $store.askUser.current.options.length > 0">Or type custom response:</span>
                    <span x-show="!$store.askUser.current.options || $store.askUser.current.options.length === 0">Your response:</span>
                </label>
                <div class="ask-user-input-row">
                    <input
                        id="ask-user-custom-input"
                        :type="$store.askUser.current.secret ? 'password' : 'text'"
                        class="ask-user-input"
                        placeholder="Type answer here..."
                        x-model="$store.askUser.textInput"
                        :disabled="$store.askUser.submitting"
                        autocomplete="off"
                        autofocus
                    >
                    <button
                        type="submit"
                        class="ask-user-submit-btn"
                        :disabled="$store.askUser.submitting || !$store.askUser.textInput.trim()"
                    >
                        <span x-show="!$store.askUser.submitting">Send</span>
                        <span x-show="$store.askUser.submitting">...</span>
                    </button>
                </div>
            </form>

            <div class="ask-user-error" x-show="$store.askUser.error" x-text="$store.askUser.error"></div>
        </div>
    </div>
</template>
