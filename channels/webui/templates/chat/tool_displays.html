{{ extension_slot("tool_views") }}

<!-- -- AI GENERATED CODE (Qwen3.8 Flash Next) :: (2026-10-22) harness:openlumara status:reviewed
     tools_load: module chips while the args stream (they grow in with the
     module_names array), then a per-module section listing each fetched tool
     with its dimmed description - the schemas themselves stay in the result. 
-->
<template x-if="toolDisplayView(tool) === 'tools-load'"
          x-data="{ get view() { return toolLoadGroups(tool, cacheKey) } }">
    <div>
        <!-- running: chips appear one by one as the module names stream in -->
        <div class="module-chips" x-show="view.running">
            <template x-for="mod in toolLoadModules(toolArgs(tool, cacheKey))">
                <span class="module-chip">
                    {% include 'svg/plug.svg' %}
                    <span x-text="mod"></span>
                </span>
            </template>
        </div>
        <!-- done: one section per module, one row per tool -->
        <template x-for="g in view.groups">
            <div class="tool-load-group">
                <div class="tool-load-module">
                    {% include 'svg/plug.svg' %}
                    <span x-text="g.module"></span>
                    <span class="tool-load-count"
                          x-text="g.tools.length + (g.tools.length === 1 ? ' tool' : ' tools')"></span>
                </div>
                <div class="tool-load-rows">
                    <template x-for="t in g.tools">
                        <div class="tool-load-row">
                            <span class="tool-load-name" x-text="t.name"></span>
                            <span class="tool-load-desc" x-show="t.description" x-text="t.description"></span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
        <!-- unknown modules + individually disabled tools as dim notes -->
        <div class="grep-note" x-show="view.notFound.length"
             x-text="'not found: ' + view.notFound.join(', ') + (view.enabled.length ? ' · enabled: ' + view.enabled.join(', ') : '')"></div>
        <div class="grep-note" x-show="view.disabled.length"
             x-text="'skipped (disabled): ' + view.disabled.join(', ')"></div>
    </div>
</template>
