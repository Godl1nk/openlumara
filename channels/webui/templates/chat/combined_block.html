<div class="combined-block" :class="{collapsed: collapsed, expanded: !collapsed}"
    {% if combined_stream %}
     x-data="{
                 // -- AI GENERATED CODE (qwen3.8-flash-next) :: (2026-10-25) harness:openlumara
                 // 'Step display mode' (localStorage: default | thinking |
                 // steps), for the getter and the x-effect below. NOTE: the
                 // 'collapsed' initializer deliberately re-reads localStorage
                 // instead of referencing this property: inside an x-data
                 // object LITERAL `this` is not the component (it's window),
                 // so initializers can never see sibling properties - getters
                 // are fine.
                 displayMode: localStorage.getItem('stepDisplayMode') || 'default',

                 collapsed: $store.stream.state === 'idle'
                 ||
                 localStorage.getItem('stepDisplayMode') === 'steps'
                 ||
             	 (localStorage.getItem('stepDisplayMode') === 'thinking'
                    && step.reasoning_live
                 ),
             
                 autoCollapsed: false,
                 // -- AI GENERATED CODE (qwen3.8-flash-next) :: (2026-10-25) harness:openlumara
                 // one-shot: the auto-open for arriving tool calls fires once
                 // per step, mirroring the autoCollapsed idiom.
                 autoOpened: false,
             	 done: $store.stream.state === 'idle',
             
                 // -- AI GENERATED CODE (qwen3.8-flash-next) :: (2026-10-25) harness:openlumara
                 // thinking is only hidden for the DURATION of this step's
                 // streaming, and only from the moment its tool calls arrive:
                 // the step pops open for the toolcards while the raw
                 // reasoning stays tucked away. once the step is done the
                 // thinking is visible again (on expand, as usual).
                 get thinkingHidden() {
                     return this.displayMode === 'thinking' && !this.done && (step.tool_calls?.length ?? 0) > 0
                 },

                 // a finished tool step at the end of the chain (waiting for
                 // the model's next step) must not keep pulsing
                 get active() {
                 	return !this.done && (step.status === 'thinking' || step.status === 'running')
                 }
             }
     "
     x-effect="
               const hasNewerStep = (turn.steps ?? []).some(s => s.step != null && s.step > step.step);
               done = $store.stream.state === 'idle' || hasNewerStep || step.status === 'done' || step.status === 'failed' || step.status === 'thoughts';

               // -- AI GENERATED CODE (qwen3.8-flash-next) :: (2026-10-25) harness:openlumara
               // the moment this live step's first tool call arrives, open
               // the step (once) so the toolcards take the stage - the
               // thinkingHidden getter keeps the raw reasoning out of sight
               // for the rest of this step's streaming.
               if (displayMode === 'thinking' && !done && (step.tool_calls?.length ?? 0) > 0 && !autoOpened) {
                   autoOpened = true;
                   collapsed = false;
               }

               if (done && !autoCollapsed) {
                   autoCollapsed = true;
                   // steps mode keeps folded steps folded; the other modes
                   // tuck finished steps away so the chain stays tidy
                   if (displayMode !== 'steps') collapsed = true
               }
    "
    {% else %}
     x-data="{ collapsed: true }"
    {% endif %}>
    <div class="node-dot" :class="{ 'dot-done': step.status === 'done' || step.status === 'thoughts', 'dot-failed': step.status === 'failed', 'dot-live': step.status === 'thinking' || step.status === 'running' }" @click.stop="collapsed = !collapsed"></div>
    <div class="header" @click="collapsed = !collapsed">
        <svg class="standalone-chevron" :class="{'expanded': !collapsed}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
        <span class="text">
            <span class="dots" {% if combined_stream %}x-show="active && (step.modules?.length > 0 || step.reasoning_live)"{% else %}x-show="false"{% endif %}><span aria-hidden="true">&nbsp;</span><span aria-hidden="true">&nbsp;</span><span aria-hidden="true">&nbsp;</span></span>
            <template x-if="(step.reasoning_content || '').trim() !== ''">
                <span class="thought-header">
                    {% if combined_stream %}
                    <span class="step-thought" x-show="!step.reasoning_live" x-text="thoughtSnippet(step.reasoning_content)"></span>
                    <span class="tool-names thinking-label" x-show="step.reasoning_live">Thinking..</span>
                    {% else %}
                    <span class="step-thought" x-text="thoughtSnippet(step.reasoning_content)"></span>
                    {% endif %}
                    <span class="step-modules" x-show="step.modules?.length > 0">
                        <template x-for="(group, gi) in step.modules" :key="'mod-'+gi">
                            <span class="module-chip">
                                <span x-show="group.actions.some(a => a.name)" x-text="group.module + ':'"></span>
                                <template x-for="(action, ai) in group.actions.filter(a => a.name)" :key="'act-'+ai">
                                    <span class="module-action"><span x-text="action.name.replaceAll('_', ' ')"></span><span class="action-count" x-show="action.count > 1" x-text="'x' + action.count"></span></span>
                                </template>
                            </span>
                        </template>
                    </span>
                </span>
            </template>
            
            <!-- thought-less step -->
            <template x-if="(step.reasoning_content || '').trim() === ''">
                <span class="bare-header">
                    <span class="tool-names" x-show="step.modules?.length > 0">
                        <template x-for="(group, gi) in step.modules" :key="gi">
                            <span class="module-group">
                                <span class="tool-module" x-show="group.actions.some(a => a.name)" x-text="group.module + ':'"></span>
                                <template x-for="(action, ai) in group.actions.filter(a => a.name)" :key="'act-'+ai">
                                    <span class="tool-action">
                                        <span x-text="(ai > 0 ? ', ' : '') + action.name.replaceAll('_', ' ')"></span><span class="tool-repeat" x-show="action.count > 1" x-text="'x' + action.count"></span>
                                    </span>
                                </template>
                            </span>
                        </template>
                    </span>
                    <span class="tool-names" x-show="!step.modules || step.modules.length === 0"
                          {% if combined_stream %}
                          x-text="step.reasoning_content ? (step.reasoning_live ? 'Thinking..' : 'Thoughts') : 'writing'"></span>
                          {% else %}
                          x-text="step.reasoning_content ? 'Thoughts' : 'writing'"></span>
                          {% endif %}
                    <span class="step-args" x-show="step.tool_calls?.length === 1"
                          x-text="step.tool_calls?.[0]?._metadata?.summary ?? ''"></span>
                    <span class="step-summary" x-show="step.tool_calls?.length === 1 && step.tool_calls[0]._metadata?.response"
                          x-text="step.tool_calls?.[0]?._metadata?.response ? toolCallResultSummary(step.tool_calls[0], step.tool_calls[0].id ?? (step.tool_call_id + ':0')) : ''"></span>
                </span>
            </template>
        </span>
    </div>
    <div x-show="!collapsed" x-collapse.duration.250>
        <div class="block">
            <!-- reasoning gets the thought bubble, like a mini Thoughts
                 block inside the step -->
            <!-- -- AI GENERATED CODE (qwen3.8-flash-next) :: (2026-10-25) harness:openlumara
                 live steps honour 'collapse thinking by default': the raw
                 reasoning hides from the moment the step's tool calls arrive
                 until the step finishes (thinkingHidden). history renders
                 it unconditionally. -->
            <div class="reasoning-row" {% if combined_stream %}x-show="step.reasoning_content && !thinkingHidden"{% else %}x-show="step.reasoning_content"{% endif %}>
                <div class="reasoning-text" x-fade-text="step.reasoning_content" x-auto-scroll></div>
            </div>
            <!-- intermediate content riding along with the step (the model
                 narrating before/while it calls tools) -->
            <template x-if="step.content">
                {% if combined_stream %}
                <div class="step-content" x-md="{ message: step, live: step.is_tail === true }"></div>
                {% else %}
                <div class="step-content" x-md="{ message: step, live: false }"></div>
                {% endif %}
            </template>
            {% set toolcard_in_step = True %}
            {% include 'chat/toolcalls.html' %}
        </div>
    </div>
</div>
