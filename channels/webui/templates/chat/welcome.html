<!-- -- AI GENERATED CODE (Qwen3.8 Flash Next) :: (2026-10-13)
     slots render into variables first: when at least one module extends
     the welcome panel, the greeting (sparkle + title + hint) steps aside
     so the module content gets the stage. trim guards against slots that

{% set slot_above = extension_slot("above_message") %}
{% set slot_below = extension_slot("below_message") %}
<template x-if="$store.chat.turnHistory.length === 0 && !$store.stream.turn.messages">
    <div class="welcome-panel">
        {{ slot_above }}

        {% if not (slot_above | trim or slot_below | trim) %}
        {% include 'svg/sparkle.svg' %}
        <h2 class="welcome-title">Hello there!</h2>
        <p class="welcome-hint">Say hi, ask me anything, or let's plan something together.</p>
        {% endif %}

        {{ slot_below }}
    </div>
</template>
