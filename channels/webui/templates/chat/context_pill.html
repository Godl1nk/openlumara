<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-21) status:reviewed
     context pill replacing the circular ring: a rounded chip whose own
     border fills clockwise (from top center) via an svg path as context
     fills up. clicking it opens the detailed breakdown popup, kept fresh
     purely via 'token_usage' + 'context_size' ws pushes from the backend
     (channel.context.get_size()) - this template never calls REST. -->
<div id="context-pill" x-cloak x-data="{
        open: false,

        get details() {
            return $store.chat.contextBreakdown;
        },

        get percentage() {
            const max = $store.system.data?.max_context;
            if (!max) return 0;
            return Math.min(($store.chat.currentTokenUsage / max) * 100, 100);
        },

        fmt: (n) => (n ?? 0).toLocaleString(),

        // -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-21) status:reviewed
        // the stacked bar: one segment per part of the context window, plus
        // whatever room is left over. widths are relative to max_context so
        // the bar is a literal picture of how full the window is.
        get segments() {
            const d = this.details;
            if (!d || !d.max_context) return [];
            const parts = [
                { key: 'sys', label: 'system prompt', tokens: d.system_prompt?.tokens || 0 },
                { key: 'tools', label: 'tools', tokens: d.tools?.tokens || 0 },
                { key: 'history', label: 'message history', tokens: d.message_history?.tokens || 0 },
                { key: 'end', label: 'end prompt', tokens: d.end_prompt?.tokens || 0 },
            ];
            const segs = parts.map(p => ({
                ...p,
                pct: Math.min((p.tokens / d.max_context) * 100, 100),
            }));
            // -- AI GENERATED CODE (qwen3.8-flash-next-q4) :: 2026-09-22 00:30 status:reviewed
            // leftover room is derived from the authoritative total_tokens
            // (which may be API-based) rather than the sum of the estimated
            // segments, so the bar always agrees with the hero percentage.
            const usedPct = Math.min((d.total_tokens / d.max_context) * 100, 100);
            segs.push({
                key: 'free',
                label: 'free',
                tokens: Math.max(d.max_context - (d.total_tokens || 0), 0),
                pct: Math.max(100 - usedPct, 0),
            });
            return segs;
        },

        // the legend skips the leftover room, it's only there to fill the bar
        get legend_segments() {
            return this.segments.filter(s => s.key !== 'free');
        },

        toggle() {
            this.open = !this.open;
        }
     }"
     @click.outside="open = false">

    <button class="pill-button"
            :class="{ 'active': percentage >= 70, 'warning': percentage >= 75 }"
            @click="toggle()"
            :title="`${$store.chat.currentTokenUsage.toLocaleString()} / ${( $store.system.data.max_context || 0 ).toLocaleString()} tokens`"
            :aria-label="'Context usage: ' + Math.round(percentage) + '%'">
        <!-- stadium outline drawn as one path starting at top center, so the
             fill stroke progresses clockwise from 12 o'clock -->
        <svg class="pill-outline" viewBox="0 0 76 30" preserveAspectRatio="none" aria-hidden="true">
            <path class="pill-track"
                  d="M38 1 H61 A14 14 0 0 1 75 15 A14 14 0 0 1 61 29 H14 A14 14 0 0 1 1 15 A14 14 0 0 1 14 1 Z"></path>
            <path class="pill-fill" pathLength="100"
                  :stroke-dasharray="percentage + ' ' + (100 - percentage)"
                  d="M38 1 H61 A14 14 0 0 1 75 15 A14 14 0 0 1 61 29 H14 A14 14 0 0 1 1 15 A14 14 0 0 1 14 1 Z"></path>
        </svg>
        <span class="pill-pct" x-text="Math.round(percentage) + '%'"></span>
    </button>

    <template x-if="open">
        <div class="context-popup">
            <div class="popup-header">
                <span class="popup-title">Context</span>
            </div>
            <template x-if="!details">
                <div class="popup-loading">Loading..</div>
            </template>
            <template x-if="details">
                <div class="popup-body">
                    <!-- hero: how full the window is -->
                    <div class="popup-hero">
                        <span class="hero-pct"
                              :class="{ 'danger': details.percent_full >= 75 }"
                              x-text="Math.round(details.percent_full) + '%'"></span>
                        <span class="hero-sub">
                            <span x-text="fmt(details.total_tokens)"></span>
                            /
                            <span x-text="fmt(details.max_context)"></span>
                            tokens
                        </span>
                    </div>

                    <template x-if="details.compaction_count > 0">
                        <div class="ctx-compaction"
                             title="older context was summarized away">
                            <span class="compaction-label"
                                  x-text="`compacted ${details.compaction_count} time${details.compaction_count === 1 ? '' : 's'}`"></span>
                        </div>
                    </template>

                    <!-- stacked bar: one segment per part of the window -->
                    <div class="ctx-bar" role="img"
                         :aria-label="`Context: ${Math.round(details.percent_full)} percent full`">
                        <template x-for="s in segments" :key="s.key">
                            <div class="bar-seg"
                                 :class="'seg-' + s.key"
                                 :style="`width: ${s.pct}%`"
                                 :title="`${s.label}: ${fmt(s.tokens)} tokens (${s.pct.toFixed(1)}%)`"></div>
                        </template>
                        <!-- -- AI GENERATED CODE (qwen3.8-flash-next-q4) :: 2026-09-22 02:52 status:reviewed
                             compression threshold: solid line at the threshold
                             percentage, plus a dark hatched zone covering the
                             remainder past it -->
                        <template x-if="details.auto_compress && details.compression_threshold > 0">
                            <div class="bar-threshold-zone"
                                 :style="`left: ${details.compression_threshold}%`"
                                 :title="`compression threshold: ${details.compression_threshold}%`"></div>
                        </template>
                        <template x-if="details.auto_compress && details.compression_threshold > 0">
                            <div class="bar-threshold"
                                 :style="`left: ${details.compression_threshold}%`"></div>
                        </template>
                    </div>

                    <!-- legend -->
                    <div class="ctx-legend">
                        <template x-for="s in legend_segments" :key="'leg-' + s.key">
                            <div class="legend-item" :class="'seg-' + s.key">
                                <span class="legend-dot"></span>
                                <span class="legend-label" x-text="s.label"></span>
                                <span class="legend-pct" x-text="s.pct >= 1 ? Math.round(s.pct) + '%' : (s.pct > 0 ? '<1%' : '0%')"></span>
                            </div>
                        </template>
                    </div>

                    <!-- raw numbers, no word counts -->
                    <div class="popup-rows">
                        <div class="popup-row">
                            <span class="popup-key">system prompt</span>
                            <span class="popup-value" x-text="fmt(details.system_prompt.tokens) + ' tokens'"></span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-key">tools</span>
                            <span class="popup-value"
                                  x-text="`${details.tools.active} active | ${fmt(details.tools.tokens)} tokens`"></span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-key">message history</span>
                            <span class="popup-value" x-text="fmt(details.message_history.tokens) + ' tokens'"></span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-key">end prompt</span>
                            <span class="popup-value" x-text="fmt(details.end_prompt.tokens) + ' tokens'"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>
</div>
