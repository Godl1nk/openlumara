<header>
    <div class="left">
        <button class="menu-btn" title="Toggle sidebar" @click="$store.ui.toggleSidebar()" x-show="$store.ui.isMobile" x-cloak>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        {% if config.get("enable_title") %}
            <h1>{{ config.get("title") }}</h1>
        {% endif %}

        <!-- extension slot: modules fill this via a left() macro in <module>/chat/header.html -->
        {{ extension_slot("left") }}
    </div>
    <div class="right">
        <!-- extension slot: modules fill this via a right() macro in <module>/chat/header.html -->
        {{ extension_slot("right") }}

        <!-- generation speed: always present, shows the last measured value -->
        <span id="tok-rate"
              x-cloak
              :class="{ 'is-empty': !($store.stream.tokens_per_second > 0) }"
              :title="($store.stream.tokens_per_second > 0)
                  ? 'Generation speed — ' + ($store.stream.tokens_per_second_source === 'server' ? 'measured by the server' : 'estimated from streamed text')
                  : 'Generation speed — no data yet'"
              :aria-label="'Generation speed: ' + $store.stream.tokens_per_second + ' tokens per second'">
            <span class="tok-rate-value" x-text="$store.stream.tokens_per_second > 0 ? $store.stream.tokens_per_second : '—'"></span>
            <span class="tok-rate-unit">tok/s</span>
        </span>
