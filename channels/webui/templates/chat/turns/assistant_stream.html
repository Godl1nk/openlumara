<div class="flex fullwidth">
    <!-- Reasoning block -->
    <template x-if="message.type === 'reasoning'">
        {% include 'chat/reasoning.html' %}
    </template>

    <!-- Content block -->
    <template x-if="message.type === 'content'">
        <div class="content" x-md="{ message: message, live: true }"></div>
    </template>

    <!-- Tool calls block -->
    <template x-if="message.type === 'tool_calls' || message.type === 'tool_call_delta'">
        {% include 'chat/toolcalls.html' %}
    </template>

    <!-- extension injection point: modules can annotate streaming assistant messages via macro in <module>/chat/turns/assistant_stream.html -->
    {{ extension_slot("below_message") }}
</div>
