<!-- -- AI GENERATED CODE (Qwen3.8 Flash Next) :: (2026-10-12)
     MODULE LIBRARY tab: browse, install, update and uninstall modules that
     come from the git repos configured under Core -> Module Libraries.
     Data/actions live in js/components/module_library.js -->
<template x-if="activeCategory === 'module_library'">
    <div class="module-library" x-data="moduleLibrary()">
        <h3 class="section-title">Get Modules</h3>
        <p class="section-desc">Install modules, channels, skills and themes from the git repositories configured under Core settings (Module Libraries).</p>

        <div class="library-message" x-show="message" x-cloak :class="messageKind" x-text="message"></div>

        <div class="library-restart" x-show="restartNeeded" x-cloak>
            <span x-text="restartNote || 'Module changes need a server restart to take effect.'"></span>
            <button type="button" class="library-btn primary" @click="restart()">Restart Now</button>
        </div>

        <!-- horizontal Modules | Channels | Themes | Skills switcher -->
        <div class="library-type-tabs">
            <button type="button" class="library-type-tab" :class="{ active: activeType === 'module' }"
                    @click="activeType = 'module'">
                <span>Modules</span>
                <span class="tab-count" x-text="typeCounts.module"></span>
            </button>
            <button type="button" class="library-type-tab" :class="{ active: activeType === 'channel' }"
                    @click="activeType = 'channel'">
                <span>Channels</span>
                <span class="tab-count" x-text="typeCounts.channel"></span>
            </button>
            <!-- -- AI GENERATED CODE (Qwen3.8 Flash Next) :: (2026-10-24) harness:openlumara
                 library repos also ship themes (themes/<name>.json) and skills
                 (skills/<name>/SKILL.md) -->
            <button type="button" class="library-type-tab" :class="{ active: activeType === 'theme' }"
                    @click="activeType = 'theme'">
                <span>Themes</span>
                <span class="tab-count" x-text="typeCounts.theme"></span>
            </button>
            <button type="button" class="library-type-tab" :class="{ active: activeType === 'skill' }"
                    @click="activeType = 'skill'">
                <span>Skills</span>
                <span class="tab-count" x-text="typeCounts.skill"></span>
            </button>
            <button type="button" class="library-btn primary library-sync-btn" @click="sync()" :disabled="syncing">
                <span class="library-sync-icon" :class="{ spinning: syncing }">{% include 'svg/reload.svg' %}</span>
                <span x-text="syncing ? 'Syncing..' : 'Sync Libraries'"></span>
            </button>
        </div>

        <div class="library-loading" x-show="loading">
            <div class="spinner"></div>
        </div>

        <template x-if="!loading">
            <div class="library-list">
                <p class="library-empty" x-show="modules.length === 0">
                    No library modules found. Add a repo url under Core settings, then press Sync Libraries.
                </p>
                <p class="library-empty" x-show="modules.length > 0 && groupedModules.length === 0" x-text="'No ' + activeType + 's found in your libraries.'"></p>

                <!-- items grouped by the repo (url) they came from -->
                <template x-for="group in groupedModules" :key="group.library">
                    <div class="library-group">
                        <h4 class="library-group-header">
                            <a :href="group.url" target="_blank" rel="noopener" x-text="group.url" :title="group.url"></a>
                        </h4>

                        <template x-for="m in group.items" :key="m.library + '/' + m.name">
                            <div class="library-item" :class="{ installed: m.installed }">
                                <div class="library-item-main">
                                    <div class="library-item-header">
                                        <span class="library-item-name" x-text="formatLabel(m.name)"></span>
                                    </div>
                                    <p class="library-item-doc" x-show="m.doc" x-text="m.doc"></p>
                                </div>
                                <span class="library-installed-indicator" x-show="m.installed" title="Installed">
                                    {% include 'svg/check_disc.svg' %}
                                </span>
                                <div class="library-item-actions">
                                    <button type="button" class="library-btn" x-show="!m.installed"
                                            @click="install(m)" :disabled="anyBusy()">
                                        <span x-text="isBusy(m) ? 'Working..' : 'Install'"></span>
                                    </button>
                                    <button type="button" class="library-btn" x-show="m.installed"
                                            @click="update(m)" :disabled="anyBusy()">
                                        <span x-text="isBusy(m) ? 'Working..' : 'Update'"></span>
                                    </button>
                                    <button type="button" class="library-btn danger" x-show="m.installed"
                                            @click="uninstall(m)" :disabled="anyBusy()">
                                        <span x-text="isBusy(m) ? 'Working..' : 'Uninstall'"></span>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <!-- -- AI GENERATED CODE (Qwen3.8 Flash Next) :: (2026-10-23) harness:openlumara
             pre-install code review overlay: read-only, syntax-highlighted
             source with jump-links to the parts that matter (dependencies,
             on_install, on_ready), warnings for shell/exec-style APIs, and a
             two-step confirm. installing = running code; this makes that clear -->
        <!-- teleported to body (same pattern as the sidebar popovers): the
             settings .modal is fixed with backface-visibility hidden, which
             would trap a position:fixed overlay inside the modal's box.
             NOTE: x-if must NOT sit on the x-teleport template itself - Alpine
             clones teleported content unconditionally at init, so visibility
             is gated by x-show/x-cloak on the overlay, with x-if *inside* it
             (keeps the inner bindings from evaluating while audit is null) -->
        <template x-teleport="body">
            <div class="library-audit-overlay" x-show="audit" x-cloak @keydown.escape.window="closeAudit()">
                <template x-if="audit">
                <div class="library-audit-modal" role="dialog" aria-modal="true">
                    <div class="library-audit-header">
                        <h3 class="section-title"
                            x-text="(audit.mode === 'update' ? 'Review code before updating: ' : 'Review code before installing: ') + audit.m.name"></h3>
                        <a class="library-audit-repo" :href="audit.url" target="_blank" rel="noopener"
                           x-text="audit.url" :title="audit.url"></a>
                    </div>

                    <p class="library-audit-lead" x-show="audit.m.type === 'module' || audit.m.type === 'channel'">
                        Modules are Python code that runs with <strong>full access to your OpenLumara</strong>.
                        Read through the source below first - the buttons under this text jump straight to the parts that matter.
                    </p>
                    <!-- -- AI GENERATED CODE (Qwen3.8 Flash Next) :: (2026-10-24) harness:openlumara
                         skills and themes are data, not executed code - but a
                         skill still tells your AI what to do, so review it too -->
                    <p class="library-audit-lead" x-show="audit.m.type === 'skill'" x-cloak>
                        Skills are instruction files that get loaded into <strong>your AI's context</strong>.
                        Read through it below first - a skill tells your AI what to do.
                    </p>
                    <p class="library-audit-lead" x-show="audit.m.type === 'theme'" x-cloak>
                        Themes are <strong>color data and CSS</strong> rendered by the WebUI (no code runs).
                        Skim it below to make sure it does nothing sketchy.
                    </p>

                    <div class="library-audit-flags" x-show="audit.flags.length > 0">
                        <template x-for="flag in audit.flags" :key="'flag-' + flag.name + '-' + flag.line">
                            <button type="button" class="audit-flag" :class="[flag.kind, { focused: audit.focusLine === flag.line }]"
                                    @click="auditJump(flag.line)">
                                <span class="audit-flag-name" x-text="flag.name"></span>
                                <span class="audit-flag-line" x-text="'line ' + flag.line"></span>
                                <span class="audit-flag-desc" x-text="flag.desc"></span>
                            </button>
                        </template>
                    </div>

                    <div class="library-audit-warnings" x-show="audit.warnings.length > 0">
                        <template x-for="(warning, i) in audit.warnings" :key="'warn-' + i">
                            <div class="audit-warning" x-text="warning"></div>
                        </template>
                    </div>

                    <div class="library-audit-filebar">
                        <label>File:
                            <select :value="audit.file" @change="auditSelectFile($event.target.value)">
                                <template x-for="f in audit.files" :key="f">
                                    <option :value="f" x-text="f"></option>
                                </template>
                            </select>
                        </label>
                        <span class="audit-truncated" x-show="audit.truncated" x-cloak>file is truncated in this view</span>
                    </div>

                    <div class="library-audit-loading" x-show="audit.loading" x-cloak>
                        <div class="spinner"></div>
                    </div>

                    <div class="library-audit-error" x-show="audit.error" x-cloak x-text="audit.error"></div>

                    <div class="library-audit-code" id="library-audit-scroll" x-show="!audit.loading && !audit.error">
                        <div class="audit-gutter" aria-hidden="true">
                            <template x-for="n in auditLineNums" :key="'ln-' + n">
                                <span class="audit-line" :class="{ focus: n === audit.focusLine }" x-text="n"></span>
                            </template>
                        </div>
                        <pre class="audit-code hljs" x-html="auditHighlighted"></pre>
                    </div>

                    <div class="library-audit-footer">
                        <span class="library-audit-footnote">Only install code you have read and trust.</span>
                        <div class="library-audit-actions">
                            <button type="button" class="library-btn" @click="closeAudit()">Reject</button>
                            <button type="button" class="library-btn danger" @click="confirmAudit()"
                                    :disabled="audit.loading || Boolean(audit.error)">Confirm</button>
                        </div>
                    </div>
                </div>
                </template>
            </div>
        </template>
    </div>
</template>
